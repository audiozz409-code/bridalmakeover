<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jyoti Sachdeva | Luxury Bridal Makeup Artist Haryana & Ambala</title>
   
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              raspberry: '#BB1C43',
              wine: '#8F1233',
              cream: '#FBF5F7',
              ivory: '#FFFDFC',
              blush: '#F6E3E8',
              roseborder: '#E6C6D0',
              gold: '#C59B27',
              darkgold: '#9E173A',
              deepcharcoal: '#2B1A20',
              muted: '#6E6265'
            }
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* ===== Premium Bridal Visual Upgrade ===== */
    html { scroll-behavior:smooth; }
    body { overflow-x:hidden; }

    .bridal-glow {
      position:absolute; width:360px; height:360px; border-radius:50%;
      background:radial-gradient(circle, rgba(197,155,39,.18), rgba(197,155,39,0) 68%);
      pointer-events:none;
    }

    .hero-frame {
      position:relative;
      isolation:isolate;
    }
    .hero-frame::before {
      content:"";
      position:absolute; inset:-18px -18px 18px 18px;
      border:1px solid rgba(197,155,39,.42);
      border-radius:150px 150px 38px 38px;
      z-index:-1;
      transform:rotate(2deg);
    }
    .hero-frame::after {
      content:"✦";
      position:absolute; right:-22px; top:12%;
      color:#C59B27; font-size:34px;
      text-shadow:0 0 18px rgba(197,155,39,.35);
    }

    .premium-img {
      transition:transform .8s cubic-bezier(.2,.7,.2,1), filter .8s ease;
      filter:saturate(.98) contrast(1.02);
    }
    .group:hover .premium-img {
      transform:scale(1.07);
      filter:saturate(1.08) contrast(1.04);
    }

    .image-shine {
      position:absolute; inset:0;
      background:linear-gradient(120deg, transparent 15%, rgba(255,255,255,.32) 48%, transparent 62%);
      transform:translateX(-120%);
      transition:transform .9s ease;
      pointer-events:none;
    }
    .group:hover .image-shine { transform:translateX(120%); }

    .gold-line {
      width:72px; height:2px; margin:0 auto;
      background:linear-gradient(90deg, transparent, #C59B27, transparent);
    }

    .lookbook-card {
      box-shadow:0 12px 35px rgba(55,35,25,.06);
    }
    .lookbook-card:hover {
      transform:translateY(-7px);
    }

    .ornament {
      position:absolute; width:110px; height:110px;
      border:1px solid rgba(197,155,39,.22);
      border-radius:50%;
      pointer-events:none;
    }
    .ornament::before, .ornament::after {
      content:""; position:absolute; inset:14px;
      border:1px solid rgba(197,155,39,.18);
      border-radius:50%;
    }

    .section-kicker::before, .section-kicker::after {
      content:"✦"; margin:0 10px; color:#C59B27; font-size:10px;
    }

    .testimonial-strip {
      background:
        radial-gradient(circle at 10% 20%, rgba(197,155,39,.12), transparent 28%),
        radial-gradient(circle at 90% 80%, rgba(230,198,208,.45), transparent 30%),
        #2B1A20;
    }

    .service-card {
      transition: transform .45s ease, box-shadow .45s ease, border-color .45s ease;
    }
    .service-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 24px 55px rgba(0,0,0,.35);
      border-color: rgba(197,155,39,.35);
    }

    @media (max-width: 640px) {
      .hero-frame::before { inset:-10px -10px 10px 10px; }
      .ornament { display:none; }
    }

    /* ===== Luxury Services Section ===== */
    .services-luxury {
      background:
        radial-gradient(circle at 8% 12%, rgba(197,155,39,.12), transparent 25%),
        radial-gradient(circle at 92% 88%, rgba(230,198,208,.58), transparent 30%),
        linear-gradient(135deg, #FBF5F7 0%, #FFFDFC 52%, #F6E3E8 100%);
    }

    .service-card-luxury {
      background: rgba(255,253,249,.96);
      border: 1px solid rgba(197,155,39,.22);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 14px 35px rgba(111,81,72,.10);
      transition: transform .45s ease, box-shadow .45s ease, border-color .45s ease;
    }

    .service-card-luxury:hover {
      transform: translateY(-8px);
      border-color: rgba(197,155,39,.58);
      box-shadow: 0 24px 55px rgba(111,81,72,.18);
    }

    .service-image-luxury {
      position: relative;
      overflow: hidden;
      background: #F3E8E1;
    }

    .service-image-luxury::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(55,35,30,.18), transparent 48%);
      pointer-events: none;
    }

    .service-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.04) contrast(1.03);
      transition: transform .75s cubic-bezier(.2,.7,.2,1), filter .75s ease;
    }

    .service-card-luxury:hover .service-photo {
      transform: scale(1.08);
      filter: saturate(1.12) contrast(1.05);
    }

    /* ===== Raspberry Bridal Luxury Theme ===== */
    .raspberry-gradient { background:linear-gradient(135deg,#8F1233 0%,#BB1C43 52%,#D33A62 100%) !important; }
    .raspberry-glow { background:radial-gradient(circle,rgba(187,28,67,.20),rgba(187,28,67,0) 68%) !important; }
    .raspberry-text { color:#BB1C43 !important; }
    .raspberry-border { border-color:rgba(187,28,67,.28) !important; }
    .hero-frame::after { color:#BB1C43; text-shadow:0 0 18px rgba(187,28,67,.28); }
    .section-kicker::before,.section-kicker::after { color:#BB1C43; }
    .gold-line { background:linear-gradient(90deg,transparent,#BB1C43 22%,#C59B27 50%,#BB1C43 78%,transparent); }
    .service-card-luxury:hover { border-color:rgba(187,28,67,.48); box-shadow:0 24px 55px rgba(143,18,51,.16); }
    .lookbook-card:hover { box-shadow:0 22px 50px rgba(143,18,51,.13); }
    .testimonial-strip { background:radial-gradient(circle at 10% 20%,rgba(197,155,39,.14),transparent 28%),radial-gradient(circle at 90% 80%,rgba(187,28,67,.30),transparent 34%),linear-gradient(135deg,#3A1722,#2B1A20 58%,#4A1528) !important; }
    .ornament { border-color:rgba(187,28,67,.20); }
    .ornament::before,.ornament::after { border-color:rgba(197,155,39,.18); }
    @media (max-width:640px){ .raspberry-gradient{background:linear-gradient(160deg,#8F1233,#BB1C43)!important;} }
  </style>
